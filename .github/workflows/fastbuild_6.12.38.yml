name: 6.12.38 欧加真OKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '38'
  KERNEL_NAME: 'android16-5-g8c67d4274c0a-ab14275539-4k'
  CCACHE_KEY: ccache-ecsv4-6.12.38

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认ReSukiSU)'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'false'
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'true'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'default'
        options:
          - 'false'
          - 'true'
          - 'default'
      bbr3_enable:
        description: '是否集成 BBRv3 拥塞控制算法与 FQ_CODEL 队列规则并将默认拥塞控制设为 bbr3(在树内 BBR v1 之外新增独立 bbr3 算法;)'
        required: true
        type: boolean
        default: 'true'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'extend'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'true'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'true'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      nomount_enable:
        description: '是否按 GKI 方式将 NoMount 内置编译进内核(NoMount 为 VFS 层路径重定向框架, 用于替代传统挂载式模块注入)'
        required: true
        type: boolean
        default: 'true'
      bore_enable:
        description: '是否集成 BORE 调度器(Burst-Oriented Response Enhancer)'
        required: true
        type: boolean
        default: 'false'
      cambyses_enable:
        description: '是否集成 Cambyses 调度器'
        required: true
        type: boolean
        default: 'flase'
      zram_ir_enable:
        description: '是否集成 ZRAM-IR 立即重压缩(zram 多级压缩的同一写入内逐级尝试: 前级压缩不达标立即换下一级压缩流重压, 减少延迟 kcomp 造成的额外内存占用)'
        required: true
        type: boolean
        default: 'true'
      kcompressd_enable:
        description: '是否集成 Kcompressd(把 kswapd 路径的页压缩/换出卸载到每 NUMA 节点独立内核线程, 降低内存回收阻塞时间)'
        required: true
        type: boolean
        default: 'false'
      lz4kdr_enable:
        description: '是否集成 LZ4KDR 压缩算法（LZ4KD 的高速衍生实现, 可与已集成的 LZ4KD 并存; 需 lz4kd_enable 同时开启以匹配适配位置)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'true'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-clang19工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev &
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）
          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev libdw-dev zip unzip ccache
          
          #使用最新版ccache v4.12.2（Ubuntu软件仓库的版本并非最新）
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8845/archive/refs/heads/oneplus/sm8845_b_16.0.0_ace_6t.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_kernel_common_oneplus_sm8845-oneplus-sm8845_b_16.0.0_ace_6t" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang19工具链..." &&
          mkdir -p clang19 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip &&
          unzip -q clang.zip -d clang19 &&
          rm -rf clang.zip &
          
          echo "正在克隆Rust 1.82.0工具链..." &&
          mkdir -p rust &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip &&
          unzip -q rust.zip -d rust &&
          rm -rf rust.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-clang19工具链初始化完成！"
          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            echo "正在配置ReSukiSU（由于SukiSU长期未维护无法正常编译，且ReSukiSU兼容sukisu管理器，故SukiSU源码仓库已重定向为resukisu）..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            #为KernelSU Next添加WildKSU管理器支持
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          fi
          
      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
          cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./common/
          cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./common/
          cd ./common
          patch -p1 < 001-lz4.patch || true
          patch -p1 < 002-zstd.patch || true

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/lz4kd.patch
          patch -p1 -F 3 < lz4kd.patch || true
          
      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
          
      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
            #以下配置选项用于编译zram模块，开启与否不影响内核编译
            echo "CONFIG_ZRAM_BACKEND_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          #跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          # 6.12内核Rust配置
          echo "CONFIG_RUST=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> ./common/arch/arm64/configs/gki_defconfig
          # 应用 CVE_2026_43499 修复补丁
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cve-2026-43499-rtmutex-6.12.patch
          patch -p1 -F 3 < cve-2026-43499-rtmutex-6.12.patch
          
      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理,提高防火墙规则处理效率,减少内存占用
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IPv6 网络地址转换
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          #由于部分机型的vintf兼容性检测规则，在开启CONFIG_IP6_NF_NAT后开机会出现"您的设备内部出现了问题。请联系您的设备制造商了解详情。"的提示，故添加一个配置修复补丁，在编译内核时隐藏CONFIG_IP6_NF_NAT=y但不影响对应功能编译
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            #开启TCP拥塞控制算法控制器（必需）
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            ################################################################################################################################
            # BBR：基于链路容量的代表拥塞控制算法，不再使用丢包、延时等信号去衡量拥塞是否发生，而是直接对网络建模来应对、避免真实的网络拥塞；
            # 具有高吞吐、低延迟、抗丢包的特点，但在手机上使用时由于持续探测带宽/RTT、高频计算与发包增加 CPU 和射频模块功耗，会增加耗电及发热；
            # 且移动基站缓冲区深度通常较小（~50ms），BBR 的带宽探测阶段（ProbeRTT）过度降窗可能导致吞吐量骤降，且网络切换（WiFi→5G）时需重新
            # 探测参数，反而增加延迟或导致速率振荡（短暂卡顿），且存在 RTT 不公平性，与基于丢包的流竞争时可能过于强势，在混合网络环境中
            #（如 BBR + CUBIC 共存），BBR 会抢占更多其他软件的带宽，降低其他应用的公平性（如后台软件更新影响前台视频播放）。
            # 因此，虽然BBR可以显著减少排队延迟，抗丢包能力强，带宽利用率高，但由于其会增加耗电，且易导致网络速率波动，故安卓系统默认不使用
            # BBR拥塞算法，而是使用在吞吐量、稳定性、兼容性、能效之间取得最佳平衡的CUBIC算法。在开启BBR前，请考虑自己是否真的有使用BBR的必要。
            ################################################################################################################################
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            #CUBIC：安卓的默认TCP拥塞控制算法，在吞吐量、稳定性、兼容性、能效之间取得最佳平衡，具有高兼容性与公平性、抗网络波动性强、低计算开销的特点，是绝大部分移动场景的优先选择
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            #VEGAS：基于时延的拥塞控制算法之一，将回路响应时间（Round Trip Time，RTT）增加视为出现拥塞，增加时增大拥塞窗口，减小时减小拥塞窗口
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            #New Vegas：Vegas 算法的改进版，优化了 RTT 测量和竞争公平性，可以更准确地检测拥塞，与 Reno/CUBIC 共存能力提升
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            #Westwood+：基于带宽估计（ACK 到达率）动态设置拥塞窗口和慢启动阈值；快速恢复，适合无线网络（区分拥塞丢包与无线丢包）
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            #HTCP：一种基于损失的算法，使用 AIMD 来控制拥塞窗口，根据 RTT 动态调整增长因子，结合延迟和丢包信号，针对高延迟的高速网络进行优化
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            #brutal：一种通过主动探测 + 激进抢占最大化吞吐量的拥塞算法，无拥塞窗口上限，轻度丢包（<20%）不降窗，避免类似 BBR 的 ProbeRTT 阶段，
            #持续维持高发送速率，与 Reno/CUBIC 共存时，Brutal 可通过高频发包抢占 90%+ 带宽，适用于高丢包弱网环境（如公共 Wi-Fi、蜂窝网络）及
            #直播推流、云游戏上行链路等需优先保证吞吐量而非延迟敏感的场景，提升弱网吞吐性能，对抗运营商 QoS 限速。但由于TCP Brutal 仅在应用程序
            #对每个 TCP 连接设置带宽参数之后才能正常工作，绝大部分安卓应用都不支持该操作，故请勿将 TCP Brutal 设置成默认拥塞控制算法。
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "正在将BBR设为默认拥塞控制算法..."
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 集成 BBRv3 拥塞控制算法与 FQ_CODEL 队列规则并设为默认
        run: |
          if [[ "${{ github.event.inputs.bbr3_enable }}" == "false" ]]; then
            echo "已按输入跳过 BBRv3 + FQ_CODEL 集成(bbr3_enable=false)"
            exit 0
          fi
          echo "正在集成 BBRv3 拥塞控制算法 + FQ_CODEL 队列规则..."
          # 任何命令失败时打印出错行号: 避免 set -e 静默退出后失败点无法定位
          trap 'echo "BBRv3 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common

          # 上游来源: omajili-manbu/Xiaomi_Rodin_Kernel_Enhance(commit a97816c1) 把 hrimfaxi/tcp_bbr_modules
          # 整理的 Google BBRv3 回移以独立算法名 "bbr3" 注册; 本副本在其基础上适配 android16-6.12.38 GKI 树:
          #   - tcp_bbr3_compat.h 探针块按本树重新烘焙: cong_control 为 4 参数(6.6 基线为 2 参数), icsk_ca_priv
          #     104B, 无 tso_segs / skb_marked_lost / fast_ack_mode / ecn_low / ecn_ect_permanent 等
          #     Google-tree 专属扩展(相应分支编译期关闭)。
          # ABI 说明: 补丁不新增导出符号、不触碰 KABI 保留区、不改动任何核心结构体布局, 仅新增
          #           net/ipv4/tcp_bbr3.c + net/ipv4/tcp_bbr3_compat.h 两个新文件与 net/ipv4/Kconfig /
          #           net/ipv4/Makefile 两个集成点, 故不破坏内核 ABI(可与设备上 OPLUS 预编译 ko 共存)。
          # 拆分: core = 两个新文件; glue = Kconfig / Makefile(树内已含集成点时自动跳过)
          CORE_FILE="bbr3-core.patch"
          GLUE_FILE="bbr3-glue.patch"
          CORE_URL="https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/bbr3-oplus.patch"
          GLUE_URL="https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/bbr3-glue-oplus.patch"
          # 下载器自适应: 优先 curl(对 4xx/5xx 返回非 0, --retry 抗弱网); 无 curl 时回退 wget
          fetch() { # $1=url $2=输出文件 $3=日志文件
            if command -v curl >/dev/null 2>&1; then
              curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$2" "$1" 2> "$3"
            else
              wget -O "$2" --tries=3 --timeout=20 "$1" 2> "$3"
            fi
          }
          download() { # $1=url $2=输出文件 $3=日志前缀
            rm -f "$2.tmp" "${3}.log"
            if fetch "$1" "$2.tmp" "${3}.log" && [ -s "$2.tmp" ]; then
              mv "$2.tmp" "$2"
              echo "下载成功: $2 ($(wc -c < "$2") 字节)"
            else
              echo "该源不可用: $(tail -n 2 "${3}.log" | tr '\n' ' ')"
              return 1
            fi
          }
          download "$CORE_URL" "$CORE_FILE" download_bbr3_core \
            || { echo "BBRv3 core 补丁下载失败: 仓库 other_patch/bbr3-oplus.patch 缺失或不可达"; exit 1; }
          download "$GLUE_URL" "$GLUE_FILE" download_bbr3_glue \
            || { echo "BBRv3 glue 补丁下载失败: 仓库 other_patch/bbr3-glue-oplus.patch 缺失或不可达"; exit 1; }

          # 一、ABI 面静态审计: 补丁若"实际新增"导出符号 / 触碰 KABI 保留区, 一律中止
          #     只审新增代码行(+), 并剔除注释行, 避免注释中提及符号名导致误判
          ABI_TOUCH="$(grep -nE '^\+.*(EXPORT_SYMBOL|ANDROID_KABI|__kabi_reserved)' "$CORE_FILE" "$GLUE_FILE" \
                      | grep -vE '^[^:]+:[0-9]+:\+[[:space:]]*(\*|/\*|//)' || true)"
          if [ -n "$ABI_TOUCH" ]; then
            echo "BBRv3 补丁触碰 ABI 面(导出符号或 KABI 保留区), 已中止:"; echo "$ABI_TOUCH"; exit 1
          fi
          # 注意: 白名单全部命中时 grep -vE 无输出返回码为 1, 必须 || true 兜底, 否则 bash -e 下静默退出
          OUT_OF_SCOPE="$(grep -E '^diff --git ' "$CORE_FILE" | grep -vE ' b/net/ipv4/tcp_bbr3(_compat)?\.(c|h)$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "BBRv3 core 补丁改动了白名单以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          OUT_OF_SCOPE="$(grep -E '^diff --git ' "$GLUE_FILE" | grep -vE ' b/net/ipv4/(Kconfig|Makefile)$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "BBRv3 glue 补丁改动了白名单以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          # 记录 ABI 敏感文件指纹(TCP 核心头文件与 tcp.c), 应用后复核
          ABI_HASHES="$(md5sum include/linux/tcp.h include/net/tcp.h include/net/inet_connection_sock.h net/ipv4/tcp.c | md5sum)"

          # 二、集成点(glue): 树内已内置则跳过, 否则严格零 fuzz 应用
          if grep -q 'config TCP_CONG_BBR3' net/ipv4/Kconfig \
             && grep -q 'tcp_bbr3\.o' net/ipv4/Makefile; then
            echo "BBRv3 集成点已存在于内核树(net/ipv4/Kconfig + Makefile), 跳过 glue 补丁"
          else
            if ! patch -p1 --dry-run -F 0 < "$GLUE_FILE" > /tmp/bbr3_glue_dryrun.log 2>&1; then
              cat /tmp/bbr3_glue_dryrun.log
              echo "BBRv3 glue 补丁存在无法应用的 hunk, 已中止"; exit 1
            fi
            cat /tmp/bbr3_glue_dryrun.log
            if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/bbr3_glue_dryrun.log; then
              echo "BBRv3 glue 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
            fi
            patch -p1 --no-backup-if-mismatch -F 0 < "$GLUE_FILE"
          fi

          # 三、core: 落地两个新文件(树内若已有同名文件先删除, 否则 new-file 补丁会被拒绝)
          rm -f net/ipv4/tcp_bbr3.c net/ipv4/tcp_bbr3_compat.h
          if ! patch -p1 --dry-run -F 0 < "$CORE_FILE" > /tmp/bbr3_core_dryrun.log 2>&1; then
            cat /tmp/bbr3_core_dryrun.log
            echo "BBRv3 core 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/bbr3_core_dryrun.log
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/bbr3_core_dryrun.log; then
            echo "BBRv3 core 补丁与当前内核树不匹配, 已中止"; exit 1
          fi
          patch -p1 --no-backup-if-mismatch -F 0 < "$CORE_FILE"

          # 四、ABI 复核: TCP 核心头文件与 tcp.c 必须与打补丁前逐字节一致
          [ "$(md5sum include/linux/tcp.h include/net/tcp.h include/net/inet_connection_sock.h net/ipv4/tcp.c | md5sum)" = "$ABI_HASHES" ] \
            || { echo "BBRv3 ABI 校验失败: TCP 核心文件被改动"; exit 1; }

          # 五、集成结果校验: 算法名/注册标志/关键实现/两个集成点必须齐全
          check() { grep -qF "$2" "$1" || { echo "BBRv3 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          checkre() { grep -qE "$2" "$1" || { echo "BBRv3 集成校验失败(正则): $1 缺少 '$2'"; exit 1; }; }
          checkre net/ipv4/tcp_bbr3.c '\.name[[:space:]]*=[[:space:]]*"bbr3",'
          checkre net/ipv4/tcp_bbr3.c 'tcp_register_congestion_control'
          check net/ipv4/tcp_bbr3.c 'bbr_register'
          check net/ipv4/tcp_bbr3_compat.h 'TCP_CONGESTION_OPS_CONG_CONTROL_HAS_4_ARGS'
          check net/ipv4/Kconfig 'config TCP_CONG_BBR3'
          check net/ipv4/Kconfig 'config DEFAULT_BBR3'
          checkre net/ipv4/Kconfig 'default "bbr3" if DEFAULT_BBR3'
          checkre net/ipv4/Makefile 'obj-\$\(CONFIG_TCP_CONG_BBR3\)[[:space:]]+\+= tcp_bbr3\.o'

          # 六、显式写入开关: 算法本体 + 设为默认拥塞控制 + 默认队列规则 fq_codel
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          # 幂等: 先移除同名/同义项(含上方 BBR 步骤可能写入的 DEFAULT_TCP_CONG / DEFAULT_BBR), 再统一追加,
          #       保证默认拥塞算法唯一确定, 重复执行本步骤也不会产生重复项
          #   注意 NET_SCH_DEFAULT 必须为 y, 否则 choice 里的 DEFAULT_FQ_CODEL 不生效(Kconfig 中它没有 default y)
          sed -i -E '/^CONFIG_(TCP_CONG_ADVANCED|TCP_CONG_BBR3|DEFAULT_BBR3|DEFAULT_TCP_CONG|DEFAULT_BBR|NET_SCH_DEFAULT|NET_SCH_FQ_CODEL|DEFAULT_FQ_CODEL)=/d' "$DEFCONFIG"
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR3=y"
            echo "CONFIG_DEFAULT_BBR3=y"
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr3"'
            echo "CONFIG_NET_SCH_DEFAULT=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_DEFAULT_FQ_CODEL=y"
          } >> "$DEFCONFIG"
          echo "BBRv3 + FQ_CODEL 集成完成(零 fuzz 应用 + ABI 面未触碰)！"
          echo "提示: bbr3 与树内 bbr(v1)/cubic 并存, 运行期可用 sysctl net.ipv4.tcp_congestion_control 查看/切换;"
          echo "      BBRv3 的 pacing 依赖 fq 类 qdisc, FQ-CODEL 已设为默认队列规则(隔离流 + AQM 低延迟)。"
          grep -E '^CONFIG_(DEFAULT_TCP_CONG|DEFAULT_BBR3|DEFAULT_FQ_CODEL|TCP_CONG_BBR3|NET_SCH_DEFAULT|NET_SCH_FQ_CODEL)=' "$DEFCONFIG"

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/common
            # 应用 Droidspaces 容器必须补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_a16-6.12.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_a16-6.12.patch || true
            # 修补 oplus_bsp_midas 行为，避免开机崩溃
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            # 修补 oplus_bsp_sched_assist 数组越界访问导致的运行随机崩溃
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ddl_hit_hook.patch
            patch -p1 -F 3 < ddl_hit_hook.patch || true
            # 应用 NTSync 补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            # 开启 Droidspaces 容器所需内核支持
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
            # 未经测试的配置选项，可能导致bug
            #echo "CONFIG_CGROUP_DEVICE=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_CGROUP_PIDS=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_FW_LOADER_COMPRESS=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_BRIDGE_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_NF_TABLES=y" >> ./arch/arm64/configs/gki_defconfig
            # 开启 NTSync
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              # 开启虚拟 HCI 设备支持
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              # 开启 systemd-coredump 支持
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
              # 添加 Lindroid EVDI DRM 驱动
              # wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/${{ env.KERNEL_VERSION }}/droidspaces_patch/evdi_drm.patch
              # patch -p1 -F 3 < evdi_drm.patch || true
              # echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          echo "正在启用ADIOS IO调度器(将截止时间优先调度算法与基于自主学习的自适应延迟控制算法相结合, 降低I/O延迟)…"
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          echo "正在启用Re-Kernel支持(用于与Freezer,NoActive等软件配合使用,提升冻结后台能力)…"
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_REKERNEL_NETWORK=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          echo "正在启用启用内核级基带保护支持…"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 集成 NoMount(按 GKI 方式内置编译)
        if: inputs.nomount_enable
        run: |
          echo "正在按 GKI 方式集成 NoMount(内置编译进内核)…"
          cd kernel_workspace/common
          # NoMount 官方 setup 脚本可自动识别 GKI 的 common/fs 目录结构，完成源码拉取、fs/nomount 符号链接、fs/Makefile 与 fs/Kconfig 的挂载
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          # 移除嵌套 Git 仓库，避免污染内核树版本信息
          rm -rf ./NoMount/.git
          # 校验集成结果，防止静默失败
          [ -f ./fs/nomount/nomount.c ] || { echo "NoMount 源码集成失败"; exit 1; }
          grep -q 'obj-$(CONFIG_NOMOUNT) += nomount/' ./fs/Makefile || { echo "fs/Makefile 挂载失败"; exit 1; }
          grep -q 'source "fs/nomount/Kconfig"' ./fs/Kconfig || { echo "fs/Kconfig 挂载失败"; exit 1; }
          # NoMount 通过内核 keyring 子系统与用户态通信，需确保 CONFIG_KEYS 开启；按 GKI 方式内置编译(=y)
          echo "CONFIG_KEYS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NOMOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "NoMount 集成完成！"

      - name: 集成 BORE 调度器(Burst-Oriented Response Enhancer)
        if: inputs.bore_enable
        run: |
          echo "正在集成 BORE 调度器(按任务突发性区分调度权重, 提升前台交互响应)…"
          cd kernel_workspace/common
          # 拉取与本 vendor 树(6.12.38)逐行对位重写的 BORE 补丁(优先取本仓库 other_patch, 兜底取上游仓库)
          # 逐源尝试并把失败原因落到日志: 避免 wget -q 静默失败 + bash -e 直接退出, 导致失败点无法定位
          rm -f bore-6.8.0-oplus.patch
          for u in \
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/bore-6.8.0-oplus.patch" \
            "https://github.com/EdMory/oplus_sm8850/raw/refs/heads/main/other_patch/bore-6.8.0-oplus.patch"; do
            echo "尝试下载 BORE 补丁: $u"
            if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o bore-6.8.0-oplus.patch "$u" 2> bore_download.log; then
              if [ -s bore-6.8.0-oplus.patch ]; then
                echo "下载成功: $(wc -c < bore-6.8.0-oplus.patch) 字节"; break
              fi
              echo "该源返回空文件, 尝试下一个源"
            else
              echo "该源不可用: $(tail -n 2 bore_download.log | tr '\n' ' ')"
            fi
          done
          rm -f bore_download.log
          [ -s bore-6.8.0-oplus.patch ] || { echo "BORE 补丁下载失败: 2 个源均不可用(见上方逐源诊断), 请检查仓库中 other_patch/bore-6.8.0-oplus.patch 是否存在"; exit 1; }

          # 一、严格零 fuzz 应用: 先 dry-run 探路, 任何 FAILED / fuzz / offset / 重复应用痕迹立即中止。
          #     旧版脚本用手写 fuzz + 就近定位"猜"位置, 补丁错位也能"成功", 是开机卡第一屏 logo 的根因之一。
          if ! patch -p1 --dry-run < bore-6.8.0-oplus.patch > /tmp/bore_dryrun.log 2>&1; then
            cat /tmp/bore_dryrun.log
            echo "BORE 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/bore_dryrun.log
          # 硬失败(fuzz / hunk 失败 / 重复应用)必须中止; 纯行号偏移不阻塞:
          # 本 workflow 中 droidspaces 等补丁会先改 include/linux/sched.h, 使行号平移,
          # 但 hunk 上下文仍精确匹配, 位置正确, 且应用后有 check/ABI 校验兜底
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/bore_dryrun.log; then
            echo "BORE 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
          fi
          if grep -q 'offset' /tmp/bore_dryrun.log; then
            echo "提示: 以下 hunk 存在纯行号偏移(上下文精确匹配, 位置正确, 属其他补丁先行改动所致), 继续应用:"
            grep 'offset' /tmp/bore_dryrun.log
          fi
          patch -p1 --no-backup-if-mismatch < bore-6.8.0-oplus.patch

          # 二、集成结果校验: 调度热路径挂钩必须齐全
          check() { grep -qF "$2" "$1" || { echo "BORE 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          check include/linux/sched.h      'struct bore_ctx {'
          check include/linux/sched/bore.h 'extern void update_curr_bore'
          check kernel/sched/bore.c        'void update_curr_bore'
          check kernel/sched/Makefile      'obj-$(CONFIG_SCHED_BORE) += bore.o'
          check kernel/sched/fair.c        'update_curr_bore(task_of(curr), delta_exec);'
          check kernel/sched/fair.c        'sched_bore_key'
          check kernel/sched/core.c        'sched_init_bore();'
          check kernel/fork.c              'task_fork_bore(p, current, clone_flags, p->start_time);'
          check kernel/futex/waitwake.c    'current->bore.futex_waiting = true;'
          check include/linux/sched.h      'ANDROID_KABI_RESERVE(8);'

          # 三、ABI 校验: bore_ctx 必须复用 task_struct 的 KABI reserve 5~8(4 x u64 = 32B) 且与原始
          #     reserve 区等长, task_struct 尺寸与后续成员偏移保持不变; 一旦改成"在 task_struct 尾部
          #     追加新字段", 结构体变大, 与 OPLUS 预编译 ko 的 ABI 冲突 -> 设备卡第一屏 logo
          grep -q 'static_assert(sizeof(struct bore_ctx) == 4 \* sizeof(u64)' kernel/sched/bore.c \
            || { echo "BORE ABI 校验失败: bore.c 缺少 sizeof(bore_ctx)==32 的编译期断言"; exit 1; }
          grep -q 'struct bore_ctx bore;' include/linux/sched.h \
            || { echo "BORE ABI 校验失败: task_struct 未挂载 bore_ctx"; exit 1; }
          grep -q '} __kabi_reserved_bore;' include/linux/sched.h \
            || { echo "BORE ABI 校验失败: 缺少 KABI reserve 备份成员, ABI 不安全"; exit 1; }
          [ "$(grep -c 'ANDROID_KABI_RESERVE(5);' include/linux/sched.h)" = "2" ] \
            || { echo "BORE ABI 校验失败: task_struct 尾部布局异常(reserve 5~8 未按 union 方式复用)"; exit 1; }
          grep -A3 'ANDROID_KABI_RESERVE(4);' include/linux/sched.h | grep -q '#ifdef CONFIG_SCHED_BORE' \
            || { echo "BORE ABI 校验失败: reserve(4) 之后未紧跟 BORE 分支"; exit 1; }

          # 四、显式写入开关与参数, 避免 defconfig 合并差异导致未启用
          echo "CONFIG_SCHED_BORE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MIN_BASE_SLICE_NS=2000000" >> ./arch/arm64/configs/gki_defconfig
          echo "BORE 集成完成(零 fuzz 应用 + ABI 校验通过)！"
      - name: 集成 Cambyses 调度器(CFS 负载均衡优化)
        if: inputs.cambyses_enable
        run: |
          echo "正在集成 Cambyses 调度器(重构 CFS 负载均衡 detach_tasks 的扫描窗口与预算判定, 减少 rq_lock 下的链表操作与无效搬迁)…"
          # 任何命令失败时打印出错行号: 避免 set -e 静默退出后失败点无法定位
          trap 'echo "Cambyses 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common

          # 上游补丁以 mainline 6.12.74 为基准, 只改写 kernel/sched/fair.c 与 kernel/sched/features.h;
          # 已逐行核对本 vendor 树(6.12.38): 9 处 hunk 上下文全部精确匹配(仅存在其它补丁造成的纯行号偏移),
          # 且补丁不新增/修改结构体成员、不新增导出符号、不触碰 KABI 保留区, 故不破坏内核 ABI。
          # 补丁优先取本仓库 other_patch 固定副本, 兜底取上游仓库与 CDN 镜像
          PATCH_URLS=(
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cambyses-6.12.74-v0.6.0.patch"
            "https://raw.githubusercontent.com/firelzrd/cambyses/main/patches/0001-6.12.74-cambyses-v0.6.0.patch"
            "https://cdn.jsdelivr.net/gh/firelzrd/cambyses@main/patches/0001-6.12.74-cambyses-v0.6.0.patch"
          )
          # 下载器自适应: 优先 curl(对 4xx/5xx 会返回非 0, --retry 抗弱网); 无 curl 时回退 wget。
          # 注意: --show-error 是 curl 专有选项, 传给 GNU wget 会触发 usage 报错并立刻退出,
          #       故 wget 分支只使用其自身合法选项(--tries/--timeout)。
          fetch() { # $1=url $2=输出文件 $3=日志文件
            if command -v curl >/dev/null 2>&1; then
              curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$2" "$1" 2> "$3"
            else
              wget -O "$2" --tries=3 --timeout=20 "$1" 2> "$3"
            fi
          }
          # 逐源尝试并把失败原因落到日志: 避免静默失败 + set -e 直接退出, 导致失败点无法诊断
          rm -f cambyses.patch
          for u in "${PATCH_URLS[@]}"; do
            echo "尝试下载 Cambyses 补丁: $u"
            if fetch "$u" cambyses.patch.tmp download_cambyses.log; then
              if [ -s cambyses.patch.tmp ]; then
                mv cambyses.patch.tmp cambyses.patch
                echo "下载成功: $(wc -c < cambyses.patch) 字节"
                break
              fi
              echo "该源返回空文件, 尝试下一个源"
            else
              echo "该源不可用: $(tail -n 2 download_cambyses.log | tr '\n' ' ')"
            fi
          done
          rm -f cambyses.patch.tmp download_cambyses.log
          [ -s cambyses.patch ] || { echo "Cambyses 补丁下载失败: 3 个源均不可用(见上方逐源诊断)"; exit 1; }

          # 一、ABI 面静态审计: 补丁触碰导出符号 / KABI 保留区 / 非 sched 核心文件, 一律中止
          if grep -nE 'EXPORT_SYMBOL|ANDROID_KABI|__kabi_reserved' cambyses.patch; then
            echo "Cambyses 补丁触碰 ABI 面(导出符号或 KABI 保留区), 已中止"; exit 1
          fi
          # 注意: 白名单全部命中时 grep -vE 无输出返回码为 1, 必须 || true 兜底,
          # 否则 bash -e 下该赋值语句会静默退出(无任何报错, 步骤直接 exit 1)
          OUT_OF_SCOPE="$(grep -E '^diff --git ' cambyses.patch | grep -vE ' b/kernel/sched/(fair\.c|features\.h)$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "Cambyses 补丁改动了 sched 核心以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          # 记录 ABI 敏感文件指纹(task_struct / struct rq 布局所在文件), 应用后复核
          ABI_HASHES="$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)"

          # 二、严格零 fuzz 应用: dry-run 探路, 任何 FAILED / fuzz / 重复应用痕迹立即中止
          if ! patch -p1 --dry-run < cambyses.patch > /tmp/cambyses_dryrun.log 2>&1; then
            cat /tmp/cambyses_dryrun.log
            echo "Cambyses 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/cambyses_dryrun.log
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/cambyses_dryrun.log; then
            echo "Cambyses 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
          fi
          if grep -q 'offset' /tmp/cambyses_dryrun.log; then
            echo "提示: 以下 hunk 存在纯行号偏移(上下文精确匹配, 位置正确, 属其它补丁先行改动所致), 继续应用:"
            grep 'offset' /tmp/cambyses_dryrun.log
          fi
          patch -p1 --no-backup-if-mismatch < cambyses.patch

          # 三、ABI 复核: 结构体布局相关文件必须与打补丁前逐字节一致
          [ "$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)" = "$ABI_HASHES" ] \
            || { echo "Cambyses ABI 校验失败: 结构体布局相关文件被改动"; exit 1; }

          # 四、集成结果校验: 两处 sched_feat 与 detach_tasks() 全部改造点必须齐全
          check() { grep -qF "$2" "$1" || { echo "Cambyses 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          check kernel/sched/features.h   'SCHED_FEAT(LB_ROTATE_BLOCK, true)'
          check kernel/sched/features.h   'SCHED_FEAT(LB_STRICT_BUDGET, true)'
          check kernel/sched/fair.c       '#define LBF_MOVED'
          check kernel/sched/fair.c       'static bool lb_cost_fits('
          check kernel/sched/fair.c       'if (!lb_cost_fits(env, &concession, p, load))'
          check kernel/sched/fair.c       'if (!lb_cost_fits(env, &concession, p, util))'
          check kernel/sched/fair.c       'if (concession.p && !(env->flags & LBF_MOVED)) {'
          check kernel/sched/fair.c       'list_rotate_to_front(resume->next, tasks);'
          check kernel/sched/fair.c       'if (!sched_feat(LB_ROTATE_BLOCK))'
          check kernel/sched/fair.c       'SCHED_CAMBYSES_VERSION'
          check kernel/sched/fair.c       'late_initcall(sched_cambyses_init);'

          # 五、运行时开关说明(不影响 ABI, 仅提示)
          if grep -q '^CONFIG_SCHED_DEBUG=y' arch/arm64/configs/gki_defconfig; then
            echo "CONFIG_SCHED_DEBUG=y: 可在 /sys/kernel/debug/sched/features 运行时开关 NO_LB_ROTATE_BLOCK / NO_LB_STRICT_BUDGET"
          else
            echo "提示: 当前未开启 CONFIG_SCHED_DEBUG, 两处特性按编译期默认值(true)固化为常量, 实际效果与开启时一致, 但不可运行时切换"
          fi
          echo "Cambyses 集成完成(零 fuzz 应用 + ABI 面未触碰)！"
      - name: 集成 ZRAM-IR 立即重压缩(ZRAM Immediate Recompression)
        if: inputs.zram_ir_enable
        run: |
          echo "正在集成 ZRAM-IR(zram 多级压缩的立即重压缩: 同一次写入内逐级尝试压缩流, 达标即停, 避免延迟 kcomp 带来的额外内存占用)…"
          # 任何命令失败时打印出错行号: 避免 set -e 静默退出后失败点无法定位
          trap 'echo "ZRAM-IR 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common

          # 上游补丁以 mainline 6.12.74 为基准, 只改写 drivers/block/zram/zram_drv.c;
          # 新增代码全部包在 #ifdef CONFIG_ZRAM_MULTI_COMP 内, 不新增导出符号、不触碰 KABI 保留区, 不破坏内核 ABI。
          # 本副本已对 6.12.38 vendor 树逐 hunk 对位(修正 zram_exit 反注册 hunk 的尾部上下文、对齐多压缩流取流口
          # comps[ZRAM_PRIMARY_COMP] -> comps[prio]), 故仅从本仓库 other_patch 取用, 不再设上游兜底源。
          PATCH_URLS=(
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/zram-ir-6.12.74-v1.3-oplus.patch"
          )
          # 下载器自适应: 优先 curl(对 4xx/5xx 返回非 0, --retry 抗弱网); 无 curl 时回退 wget(只用其自身合法选项)
          fetch() { # $1=url $2=输出文件 $3=日志文件
            if command -v curl >/dev/null 2>&1; then
              curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$2" "$1" 2> "$3"
            else
              wget -O "$2" --tries=3 --timeout=20 "$1" 2> "$3"
            fi
          }
          rm -f zram-ir.patch
          for u in "${PATCH_URLS[@]}"; do
            echo "尝试下载 ZRAM-IR 补丁: $u"
            if fetch "$u" zram-ir.patch.tmp download_zram_ir.log; then
              if [ -s zram-ir.patch.tmp ]; then
                mv zram-ir.patch.tmp zram-ir.patch
                echo "下载成功: $(wc -c < zram-ir.patch) 字节"
                break
              fi
              echo "该源返回空文件, 尝试下一个源"
            else
              echo "该源不可用: $(tail -n 2 download_zram_ir.log | tr '\n' ' ')"
            fi
          done
          rm -f zram-ir.patch.tmp download_zram_ir.log
          [ -s zram-ir.patch ] || { echo "ZRAM-IR 补丁下载失败: 仓库 other_patch/zram-ir-6.12.74-v1.3-oplus.patch 缺失或不可达(见上方诊断)"; exit 1; }

          # 一、前置条件: 补丁全部改动都在 #ifdef CONFIG_ZRAM_MULTI_COMP 内, 若当前内核树无该 Kconfig 项,
          #     补丁会"应用成功但功能静默失效", 故此处直接中止, 宁可失败也不假成功。
          grep -q 'config ZRAM_MULTI_COMP' drivers/block/zram/Kconfig \
            || { echo "ZRAM-IR 前置检查失败: 当前内核树不支持 CONFIG_ZRAM_MULTI_COMP(多压缩流), 该补丁无法生效; 请关闭 zram_ir_enable"; exit 1; }

          # 二、ABI 面静态审计: 补丁触碰导出符号 / KABI 保留区, 一律中止
          if grep -nE 'EXPORT_SYMBOL|ANDROID_KABI|__kabi_reserved' zram-ir.patch; then
            echo "ZRAM-IR 补丁触碰 ABI 面(导出符号或 KABI 保留区), 已中止"; exit 1
          fi
          # 注意: 白名单全部命中时 grep -vE 无输出返回码为 1, 必须 || true 兜底,
          # 否则 bash -e 下该赋值语句会静默退出
          OUT_OF_SCOPE="$(grep -E '^diff --git ' zram-ir.patch | grep -vE ' b/drivers/block/zram/zram_drv\.c$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "ZRAM-IR 补丁改动了 zram_drv.c 以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          # 记录 ABI 敏感文件指纹(task_struct / struct rq 布局所在文件), 应用后复核
          ABI_HASHES="$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)"

          # 三、严格零 fuzz 应用: dry-run 探路, 任何 FAILED / fuzz / 重复应用痕迹立即中止
          if ! patch -p1 --dry-run < zram-ir.patch > /tmp/zram_ir_dryrun.log 2>&1; then
            cat /tmp/zram_ir_dryrun.log
            echo "ZRAM-IR 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/zram_ir_dryrun.log
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/zram_ir_dryrun.log; then
            echo "ZRAM-IR 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
          fi
          if grep -q 'offset' /tmp/zram_ir_dryrun.log; then
            echo "提示: 以下 hunk 存在纯行号偏移(上下文精确匹配, 位置正确, 属其它补丁先行改动所致), 继续应用:"
            grep 'offset' /tmp/zram_ir_dryrun.log
          fi
          patch -p1 --no-backup-if-mismatch < zram-ir.patch

          # 四、ABI 复核: 结构体布局相关文件必须与打补丁前逐字节一致
          [ "$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)" = "$ABI_HASHES" ] \
            || { echo "ZRAM-IR ABI 校验失败: 结构体布局相关文件被改动"; exit 1; }

          # 五、集成结果校验: sysctl 注册、多级压缩循环与页优先级记录必须齐全
          check() { grep -qF "$2" "$1" || { echo "ZRAM-IR 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          checkre() { grep -qE "$2" "$1" || { echo "ZRAM-IR 集成校验失败(正则): $1 缺少 '$2'"; exit 1; }; }
          check drivers/block/zram/zram_drv.c 'sysctl_zram_recomp_immediate'
          checkre drivers/block/zram/zram_drv.c 'procname[[:space:]]*= "zram_recomp_immediate"'
          check drivers/block/zram/zram_drv.c 'zram_sysctl_table_header'
          check drivers/block/zram/zram_drv.c 'sysctl_zram_recomp_immediate + 1'
          check drivers/block/zram/zram_drv.c 'prio = last_prio;'
          check drivers/block/zram/zram_drv.c 'zram_set_priority(zram, index, prio);'
          check drivers/block/zram/zram_drv.c 'register_sysctl("vm", zram_sysctl_table)'
          check drivers/block/zram/zram_drv.c 'unregister_sysctl_table(zram_sysctl_table_header)'
          check drivers/block/zram/zram_drv.c 'ZRAM_IR_VERSION'

          # 六、显式写入开关: 该特性必须在 CONFIG_ZRAM_MULTI_COMP 下编译生效
          grep -q '^CONFIG_ZRAM_MULTI_COMP=' arch/arm64/configs/gki_defconfig \
            || echo "CONFIG_ZRAM_MULTI_COMP=y" >> arch/arm64/configs/gki_defconfig
          echo "提示: 运行时可通过 /proc/sys/vm/zram_recomp_immediate(取值 0~3, 默认 1)调节立即重压缩档位, 0 即关闭"
          echo "ZRAM-IR 集成完成(零 fuzz 应用 + ABI 面未触碰)！"
      - name: 集成 LZ4KDR 压缩算法(LZ4KD 高速衍生版)
        if: inputs.lz4kdr_enable
        run: |
          echo "正在集成 LZ4KDR(华为 LZ4KD 的高速衍生实现: 线格式与 LZ4KD 兼容, 重写编码器搜索循环; 新增 zram 后端 backend_lz4kdr 与 lib/lz4kdr/ 独立实现)…"
          # 任何命令失败时打印出错行号: 避免 set -e 静默退出后失败点无法定位
          trap 'echo "LZ4KDR 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common

          # 上游补丁以 mainline 6.12.74 为基准, 改动 5 个既有文件 + 新增 9 个文件(zram 后端与 lib/lz4kdr/ 独立实现);
          # 本副本已对 6.12.38 vendor 树逐 hunk 对位(适配树内已集成的 lz4kd: 后端选项、默认压缩项、
          # 后端注册表全部改为紧随 LZ4KD 之后插入, 避开已存在同名 LZ4K/LZ4KD 段的覆盖冲突)。
          # 补丁仅新增 lz4kdr_* 前缀导出符号(不改动任何既有 KABI 面), 可与已集成的 LZ4KD 并存, 故仅从本仓库 other_patch 取用。
          PATCH_URLS=(
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/lz4kdr-6.12.74-oplus.patch"
          )
          # 下载器自适应: 优先 curl(对 4xx/5xx 返回非 0, --retry 抗弱网); 无 curl 时回退 wget(只用其自身合法选项)
          fetch() { # $1=url $2=输出文件 $3=日志文件
            if command -v curl >/dev/null 2>&1; then
              curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$2" "$1" 2> "$3"
            else
              wget -O "$2" --tries=3 --timeout=20 "$1" 2> "$3"
            fi
          }
          rm -f lz4kdr.patch
          for u in "${PATCH_URLS[@]}"; do
            echo "尝试下载 LZ4KDR 补丁: $u"
            if fetch "$u" lz4kdr.patch.tmp download_lz4kdr.log; then
              if [ -s lz4kdr.patch.tmp ]; then
                mv lz4kdr.patch.tmp lz4kdr.patch
                echo "下载成功: $(wc -c < lz4kdr.patch) 字节"
                break
              fi
              echo "该源返回空文件, 尝试下一个源"
            else
              echo "该源不可用: $(tail -n 2 download_lz4kdr.log | tr '\n' ' ')"
            fi
          done
          rm -f lz4kdr.patch.tmp download_lz4kdr.log
          [ -s lz4kdr.patch ] || { echo "LZ4KDR 补丁下载失败: 仓库 other_patch/lz4kdr-6.12.74-oplus.patch 缺失或不可达(见上方诊断)"; exit 1; }

          # 一、前置条件: 适配位置建立在树内已有的 LZ4KD 后端选项之后, mainline 树无 ZRAM_BACKEND_LZ4KD,
          #     若该段不存在则说明 lz4kd 未集成, 补丁会落错位置, 故直接中止。
          grep -q 'config ZRAM_BACKEND_LZ4KD' drivers/block/zram/Kconfig \
            || { echo "LZ4KDR 前置检查失败: 当前树未集成 LZ4KD(缺 ZRAM_BACKEND_LZ4KD 段), 补丁锚点不存在; 请同时开启 lz4kd_enable"; exit 1; }

          # 二、ABI 面静态审计:
          #     1) 触碰 KABI 保留区一律中止;
          #     2) 导出符号仅允许 lz4kdr_* 新符号(带分号结尾的真实导出行, 排除 userspace shim 的 #define);
          #     3) 白名单外文件一律中止。
          if grep -nE 'ANDROID_KABI|__kabi_reserved' lz4kdr.patch; then
            echo "LZ4KDR 补丁触碰 KABI 保留区, 已中止"; exit 1
          fi
          BAD_SYMS="$(grep -oE 'EXPORT_SYMBOL(_GPL)?\([A-Za-z_][A-Za-z0-9_]*\);' lz4kdr.patch \
            | sed -E 's/.*\(([A-Za-z_][A-Za-z0-9_]*)\);/\1/' | sort -u | grep -vE '^lz4kdr_' || true)"
          if [ -n "$BAD_SYMS" ]; then
            echo "LZ4KDR 补丁导出了非 lz4kdr_* 前缀的符号, 已中止:"; echo "$BAD_SYMS"; exit 1
          fi
          for s in $(grep -oE 'EXPORT_SYMBOL(_GPL)?\(lz4kdr_[A-Za-z0-9_]*\);' lz4kdr.patch | sed -E 's/.*\(([A-Za-z0-9_]+)\);/\1/' | sort -u); do
            if grep -rqE "EXPORT_SYMBOL(_GPL)?\(\s*$s\s*\)" --include='*.c' . 2>/dev/null; then
              echo "LZ4KDR 符号冲突: $s 在树中已存在同名导出, 已中止"; exit 1
            fi
          done
          # 注意: 白名单全部命中时 grep -vE 无输出返回码为 1, 必须 || true 兜底, 否则 bash -e 下静默退出
          OUT_OF_SCOPE="$(grep -E '^diff --git ' lz4kdr.patch | grep -vE ' b/(drivers/block/zram/(Kconfig|Makefile|zcomp\.c|backend_lz4kdr\.[ch])|include/linux/lz4kdr\.h|lib/(Kconfig|Makefile)|lib/lz4kdr/[^/]+)$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "LZ4KDR 补丁改动了白名单以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          ABI_HASHES="$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)"

          # 三、严格零 fuzz 应用: dry-run 探路, 任何 FAILED / fuzz / 重复应用痕迹立即中止
          if ! patch -p1 --dry-run < lz4kdr.patch > /tmp/lz4kdr_dryrun.log 2>&1; then
            cat /tmp/lz4kdr_dryrun.log
            echo "LZ4KDR 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/lz4kdr_dryrun.log
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/lz4kdr_dryrun.log; then
            echo "LZ4KDR 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
          fi
          if grep -q 'offset' /tmp/lz4kdr_dryrun.log; then
            echo "提示: 以下 hunk 存在纯行号偏移(上下文精确匹配, 位置正确, 属其它补丁先行改动所致), 继续应用:"
            grep 'offset' /tmp/lz4kdr_dryrun.log
          fi
          patch -p1 --no-backup-if-mismatch < lz4kdr.patch

          # 四、ABI 复核: 结构体布局相关文件必须与打补丁前逐字节一致
          [ "$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)" = "$ABI_HASHES" ] \
            || { echo "LZ4KDR ABI 校验失败: 结构体布局相关文件被改动"; exit 1; }

          # 五、集成结果校验: 后端选项/默认压缩项/后端注册表/独立实现目录必须齐全
          check() { grep -qF "$2" "$1" || { echo "LZ4KDR 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          checkre() { grep -qE "$2" "$1" || { echo "LZ4KDR 集成校验失败(正则): $1 缺少 '$2'"; exit 1; }; }
          check drivers/block/zram/Kconfig 'config ZRAM_BACKEND_LZ4KDR'
          check drivers/block/zram/Kconfig 'config ZRAM_DEF_COMP_LZ4KDR'
          checkre drivers/block/zram/Makefile 'zram-\$\(CONFIG_ZRAM_BACKEND_LZ4KDR\)[[:space:]]+\+= backend_lz4kdr\.o'
          check drivers/block/zram/zcomp.c '#include "backend_lz4kdr.h"'
          check drivers/block/zram/zcomp.c '&backend_lz4kdr,'
          check lib/Kconfig 'config LZ4KDR_COMPRESS'
          check lib/Makefile 'obj-$(CONFIG_LZ4KDR_COMPRESS) += lz4kdr/'
          check lib/lz4kdr/lz4kdr_encode.c 'EXPORT_SYMBOL(lz4kdr_encode);'
          check include/linux/lz4kdr.h 'lz4kdr_encode_state_bytes_min'

          # 六、显式写入开关: 该后端在 CONFIG_ZRAM_BACKEND_LZ4KDR 下编译生效(与 LZ4KD 后端并存)
          grep -q '^CONFIG_ZRAM_BACKEND_LZ4KDR=' arch/arm64/configs/gki_defconfig \
            || echo "CONFIG_ZRAM_BACKEND_LZ4KDR=y" >> arch/arm64/configs/gki_defconfig
          echo "提示: LZ4KDR 与 LZ4KD 同为 zram 可选后端, 运行时通过 /sys/block/zram0/compressor 选择具体算法"
          echo "LZ4KDR 集成完成(零 fuzz 应用 + KABI 面未触碰)！"
      - name: 集成 Kcompressd(内存回收压缩异步化)
        if: inputs.kcompressd_enable
        run: |
          echo "正在集成 Kcompressd(把 kswapd 路径的页压缩/换出卸载到每 NUMA 节点独立内核线程, 降低内存回收阻塞时间)…"
          trap 'echo "Kcompressd 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common

          # 上游补丁以 mainline 6.12.44 为基准, 改动 7 个文件(均为 mm/ 内部结构与 kswapd 路径);
          # 不新增导出符号、不触碰 KABI 保留区, 不破坏内核 ABI; 与 lru_marie 设计互斥(本项目未集成 lru_marie)。
          # 本副本已对 6.12.38 vendor 树逐 hunk 对位(适配 mmzone.h 成员布局、page_io.c 换出路径与
          # vmscan.c 中已重构的 kswapd_stop/kthread_stop 上下文), 故仅从本仓库 other_patch 取用, 不再设上游兜底源。
          PATCH_URLS=(
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/kcompressd-6.12.44-unofficial-0.5-oplus.patch"
          )
          fetch() { # $1=url $2=输出文件 $3=日志文件
            if command -v curl >/dev/null 2>&1; then
              curl -fSL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$2" "$1" 2> "$3"
            else
              wget -O "$2" --tries=3 --timeout=20 "$1" 2> "$3"
            fi
          }
          rm -f kcompressd.patch
          for u in "${PATCH_URLS[@]}"; do
            echo "尝试下载 Kcompressd 补丁: $u"
            if fetch "$u" kcompressd.patch.tmp download_kcompressd.log; then
              if [ -s kcompressd.patch.tmp ]; then
                mv kcompressd.patch.tmp kcompressd.patch
                echo "下载成功: $(wc -c < kcompressd.patch) 字节"
                break
              fi
              echo "该源返回空文件, 尝试下一个源"
            else
              echo "该源不可用: $(tail -n 2 download_kcompressd.log | tr '\n' ' ')"
            fi
          done
          rm -f kcompressd.patch.tmp download_kcompressd.log
          [ -s kcompressd.patch ] || { echo "Kcompressd 补丁下载失败: 仓库 other_patch/kcompressd-6.12.44-unofficial-0.5-oplus.patch 缺失或不可达(见上方诊断)"; exit 1; }

          # 一、ABI 面静态审计: 补丁触碰导出符号 / KABI 保留区, 一律中止
          if grep -nE 'EXPORT_SYMBOL|ANDROID_KABI|__kabi_reserved' kcompressd.patch; then
            echo "Kcompressd 补丁触碰 ABI 面(导出符号或 KABI 保留区), 已中止"; exit 1
          fi
          OUT_OF_SCOPE="$(grep -E '^diff --git ' kcompressd.patch | grep -vE ' b/(include/linux/mmzone\.h|include/linux/swap\.h|kernel/sysctl\.c|mm/mm_init\.c|mm/page_io\.c|mm/swap\.h|mm/vmscan\.c)$' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "Kcompressd 补丁改动了白名单以外的文件, 已中止:"; echo "$OUT_OF_SCOPE"; exit 1
          fi
          ABI_HASHES="$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)"

          # 二、严格零 fuzz 应用: dry-run 探路, 任何 FAILED / fuzz / 重复应用痕迹立即中止
          if ! patch -p1 --dry-run < kcompressd.patch > /tmp/kcompressd_dryrun.log 2>&1; then
            cat /tmp/kcompressd_dryrun.log
            echo "Kcompressd 补丁存在无法应用的 hunk, 已中止"; exit 1
          fi
          cat /tmp/kcompressd_dryrun.log
          if grep -qE 'with fuzz|FAILED|ignored|Reversed|previously applied' /tmp/kcompressd_dryrun.log; then
            echo "Kcompressd 补丁与当前内核树不匹配(fuzz / hunk 失败 / 重复应用), 已中止"; exit 1
          fi
          if grep -q 'offset' /tmp/kcompressd_dryrun.log; then
            echo "提示: 以下 hunk 存在纯行号偏移(上下文精确匹配, 位置正确, 属其它补丁先行改动所致), 继续应用:"
            grep 'offset' /tmp/kcompressd_dryrun.log
          fi
          patch -p1 --no-backup-if-mismatch < kcompressd.patch

          # 三、ABI 复核: 结构体布局相关文件必须与打补丁前逐字节一致
          [ "$(md5sum include/linux/sched.h kernel/sched/sched.h | md5sum)" = "$ABI_HASHES" ] \
            || { echo "Kcompressd ABI 校验失败: 结构体布局相关文件被改动"; exit 1; }

          # 四、集成结果校验: pg_data_t 成员、线程创建/销毁、FIFO 与 sysctl 节点必须齐全
          check() { grep -qF "$2" "$1" || { echo "Kcompressd 集成校验失败: $1 缺少 '$2'"; exit 1; }; }
          checkre() { grep -qE "$2" "$1" || { echo "Kcompressd 集成校验失败(正则): $1 缺少 '$2'"; exit 1; }; }
          check include/linux/mmzone.h '#define KCOMPRESS_FIFO_SIZE 256'
          check include/linux/mmzone.h 'struct task_struct *kcompressd;'
          check include/linux/mmzone.h 'kcompress_fifo_lock'
          check include/linux/swap.h   'extern int vm_kcompressd'
          checkre kernel/sysctl.c      'procname[[:space:]]*= "kcompressd"'
          check kernel/sysctl.c        'int vm_kcompressd = 24;'
          check mm/mm_init.c           'init_waitqueue_head(&pgdat->kcompressd_wait)'
          check mm/swap.h              'int kcompressd(void *p)'
          check mm/page_io.c           'static bool kcompressd_store(struct folio *folio)'
          check mm/page_io.c           'int kcompressd(void *p)'
          check mm/vmscan.c            'kthread_create_on_node(kcompressd'
          check mm/vmscan.c            'Kcompressd-Unofficial 0.5'

          # 五、运行时说明(不影响 ABI 与构建): 队列上限由 /proc/sys/vm/kcompressd 控制, 0 即关闭
          if grep -q '^CONFIG_ZSWAP=y' arch/arm64/configs/gki_defconfig; then
            echo "CONFIG_ZSWAP=y: kcompressd 将在 kswapd 路径异步压缩 zswap 回写, 收益最明显"
          else
            echo "提示: 当前未开启 CONFIG_ZSWAP, kcompressd 仅在存在同步 swap 设备(SWP_SYNCHRONOUS_IO)时生效"
          fi
          echo "提示: 运行时可通过 /proc/sys/vm/kcompressd(取值 0~256, 默认 24)调节队列上限, 0 即关闭"
          echo "Kcompressd 集成完成(零 fuzz 应用 + ABI 面未触碰)！"
      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "当前内核版本后缀：${{ github.event.inputs.kernel_suffix }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ github.event.inputs.KERNEL_SUFFIX }}/g' ./common/arch/arm64/configs/gki_defconfig
          else
            echo "当前内核版本后缀：${{ env.KERNEL_NAME }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig
          fi
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig
           
      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang19/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"
          export CLANG_DIR="$WORKDIR/kernel_workspace/clang19/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          RUSTC_VERSION="$(rustc -V 2>/dev/null | head -n1)"
          BINDGEN_VERSION="$(bindgen --version 2>/dev/null | head -n1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          echo "Rustc版本: $RUSTC_VERSION"
          echo "Bindgen版本: $BINDGEN_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"
          
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          export REAL_CLANG_PATH="$WORKDIR/kernel_workspace/clang19/bin/clang"
          #创建 CC (编译器) 包装器
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache $REAL_CLANG_PATH "$@"' >> cc-wrapper
          #创建 LD (链接器) 包装器
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          
          # 测试时间劫持测试是否正常工作
          echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper 内部环境检查完毕."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh # 执行所有传入的参数
          chmod +x test-wrapper.sh
          echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"
          ./test-wrapper.sh date
          echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"
          ./test-wrapper.sh stat ./Makefile
          echo "--- [Wrapper Test] 测试完毕 ---"
          chmod +x cc-wrapper ld-wrapper
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译前环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          
          # 6.12内核make编译核心配置：
          # 1. 重映射物理路径 (由于6.12内核引入了Rust代码，计算内核符号版本的工具变成了gendwarfksyms，而gendwarfksyms无法正确预处理绝对路径，故我们需要手动把绝对路径重映射为相对路径，否则内核符号校验值会大面积出错)
          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          # 2. 声明Rust等工具（此处若不进行声明，内核编译前的Rust环境预检测脚本scripts/rust_is_available.sh会检测失败，导致内核无法正常开启Rust代码编译）
          export RUSTC="rustc"
          export BINDGEN="bindgen"
          export CC="clang"
          export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang19/lib"
          # 3. 配置KCFLAGS
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS
          # 4. 配置其他工具及选项（非必须，防错冗余）
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm AS=clang READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size STRIP=llvm-strip
          # 5. 编译前运行官方环境配置脚本
          source "./_setup_env.sh" 2>/dev/null || true
          
          #在构建内核的同时清除不必要的.NET, Android NDK, Haskell, CodeQL运行库，清理空间且不阻塞后续步骤运行
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig &&
          export CC="$(pwd)/cc-wrapper" && export LD="$(pwd)/ld-wrapper" &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" OBJCOPY="llvm-objcopy" O=out Image
          
          # 编译后时间劫持二次校验
          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译后环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "内核编译完成！"
          if [[ "${{ github.event.inputs.ccache_debug }}" == "true" ]]; then
            echo "正在打包ccache日志及调试信息..."
            cd ..
            cp ./common/out/vmlinux.symvers ./vmlinux.symvers
            cp ./common/out/.config ./config
            zip -r9 debug.zip ccache.log config vmlinux.symvers
          fi
          echo "ccache状态："
          ccache -s
          echo "编译后空间:"
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
         
      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image
          
      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi
          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          
          #为AK3添加注释（调试信息）
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "susfs: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPset: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          echo "NoMount: ${{ github.event.inputs.nomount_enable }}" >> ./ak3.log
          echo "BORE: ${{ github.event.inputs.bore_enable }}" >> ./ak3.log
          echo "Cambyses: ${{ github.event.inputs.cambyses_enable }}" >> ./ak3.log
          echo "ZRAM-IR: ${{ github.event.inputs.zram_ir_enable }}" >> ./ak3.log
          echo "Kcompressd: ${{ github.event.inputs.kcompressd_enable }}" >> ./ak3.log
          echo "LZ4KDR: ${{ github.event.inputs.lz4kdr_enable }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/debug.zip
          archive: false

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV
         
      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 欧加真 ${{ env.KSU_TYPENAME }} sm8850 通用内核 | 构建信息
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：欧加真骁龙8E Gen5通用 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核（基于一加Ace6t ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 版官方源码）
          - KSU分支：${{ env.KSU_TYPENAME }}
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持 ：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - ADIOS IO调度器支持：${{ github.event.inputs.adios_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}
          - NoMount(VFS 路径重定向)支持：${{ github.event.inputs.nomount_enable }}
          - BORE 调度器支持：${{ github.event.inputs.bore_enable }}（Burst-Oriented Response Enhancer，按任务突发性区分调度权重）
          - Cambyses 调度器支持：${{ github.event.inputs.cambyses_enable }}（CFS 负载均衡优化：detach_tasks 扫描窗口块旋转 + 严格预算判定，不改变 ABI）
          - ZRAM-IR 立即重压缩支持：${{ github.event.inputs.zram_ir_enable }}（zram 多级压缩同一写入内逐级尝试，达标即停）
          - Kcompressd 支持：${{ github.event.inputs.kcompressd_enable }}（kswapd 页压缩/换出卸载至独立内核线程，降低回收阻塞）
          - LZ4KDR 支持：${{ github.event.inputs.lz4kdr_enable }}（LZ4KD 的高速衍生实现，线格式兼容、重写编码器搜索循环，与 LZ4KD 后端并存）
          - ReSukiSU管理器下载：[ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)
          - SukiSU Ultra管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)
          
          ### ⏫️ 更新内容：
          - 更新${{ env.KSU_TYPENAME }}至最新版本（${{ needs.build.outputs.ksuver }}）
          - (预留)
          
          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
          3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启；
          4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
          5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器（包括除KernelSU Next以外的各分支）需要配合元模块(metamodule)才能正常挂载模块。目前的元模块包括[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta-magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount)等。若你是第一次使用KSU或刚从旧版KSU管理器升级至新版，请先安装一个元模块，这样其他涉及系统挂载的模块才能正常运行；
          6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，可以运行在任意KSU/面具环境中（不适用于Apatch），且不能与(Re)SukiSU内置的kpm功能共同使用，使用前请保证你的内核没有内置的kpm实现/修补。
          
          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
