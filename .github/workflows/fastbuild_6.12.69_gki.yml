      - name: 集成 INTFP 整数定点/伪对数数学库
        if: inputs.intfp_enable
        run: |
          echo "正在集成 intfp 1.5…"
          # 任何命令失败时打印出错行号: 避免 set -e 静默退出后失败点无法定位
          trap 'echo "intfp 集成步骤在脚本第 $LINENO 行失败(退出码 $?)" >&2' ERR
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/intfp-1.5-6.12.patch
          patch -p1 -F 0 --no-backup-if-mismatch < intfp-1.5-6.12.patch
          grep -q 'source "lib/intfp/Kconfig"' lib/Kconfig || \
            sed -i '/source "lib\/fonts\/Kconfig"/a\\nsource "lib/intfp/Kconfig"\n' lib/Kconfig
          grep -q 'obj-$(CONFIG_INTFP) += intfp/' lib/Makefile || \
            sed -i '/obj-$(CONFIG_PLDMFW)/a\\nobj-$(CONFIG_INTFP) += intfp/\n' lib/Makefile
          echo "CONFIG_INTFP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "提示: 内核代码 include <linux/intfp.h> 即可按需使用; 启动后可用 dmesg | grep intfp 查看内置自检结果"
          echo "intfp 集成完成"

      - name: 集成 ISQRT 整数平方根快速库
        if: inputs.isqrt_enable
        run: |
          echo "正在集成 isqrt 1.0(firelzrd/isqrt: isqrt8/16/32/64 四种位宽精确 floor(sqrt), __builtin_clz 定位 + LUT + Newton-Raphson, 比内核 int_sqrt 快 2~8 倍; 内核侧为 header-only 移植)…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/isqrt-1.0-6.12.patch
          patch -p1 -F 0 --no-backup-if-mismatch < isqrt-1.0-6.12.patch
          grep -q 'source "lib/isqrt/Kconfig"' lib/Kconfig || \
            sed -i '/source "lib\/intfp\/Kconfig"/a\\nsource "lib/isqrt/Kconfig"\n' lib/Kconfig
          grep -q 'obj-$(CONFIG_ISQRT) += isqrt/' lib/Makefile || \
            sed -i '/obj-$(CONFIG_INTFP) += intfp/a\\nobj-$(CONFIG_ISQRT) += isqrt/\n' lib/Makefile
          echo "CONFIG_ISQRT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "启动后可用 dmesg | grep isqrt 查看内置自检结果"
