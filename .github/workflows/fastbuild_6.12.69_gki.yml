          cd kernel_workspace/common
          #添加更多拥塞算法支持
          echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_CUBIC=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_VEGAS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_NV=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_HTCP=y" >> arch/arm64/configs/gki_defconfig
          #更新BBR3
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/bbr3-6.12.69-kabi.patch
          patch --batch --forward -p1 -F 0 --no-backup-if-mismatch < bbr3-6.12.69-kabi.patch
          #更新TCP Brutal 2.0.1
          wget -O tcp-brutal-upgrade.sh https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/tcp-brutal-upgrade.sh
          bash tcp-brutal-upgrade.sh
          #BBR为默认拥塞算法
          echo "CONFIG_TCP_CONG_BRUTAL=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEFAULT_BBR=y" >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> arch/arm64/configs/gki_defconfig
          #FQ_CODEL为默认队列算法
          echo "CONFIG_NET_SCH_DEFAULT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEFAULT_FQ_CODEL=y" >> arch/arm64/configs/gki_defconfig
          echo "更多拥塞算法已集成，BBR为默认拥塞算法，FQ_CODEL为默认队列算法"
          
      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理,提高防火墙规则处理效率,减少内存占用
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
