name: 6.12.69 GKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '69_gki'
  KERNEL_NAME: 'android16-6-g242e1a07f878-ab15865446-4k'
  CCACHE_KEY: ccache-ecsv4-gki-6.12.69

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: '选择 KernelSU 分支'
        required: true
        type: choice
        default: 'KowSU'
        options:
          - 'BakaSU'
          - 'KowSU'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启 SuSFS (用于增强隐藏环境挂载功能)'
        required: true
        type: boolean
        default: 'false'
      vfs_provider:
        description: 'VFS 模块注入方案'
        required: true
        type: choice
        default: 'nomount'
        options:
          - 'none'
          - 'nomount'
          - 'hybridmount'
      kpm_enable:
        description: '是否开启 KPN (使用KpatchNext独立实现)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 LZ4 和 ZSTD 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kds_enable:
        description: '是否安装 LZ4KDS 补丁'
        required: true
        type: boolean
        default: 'true'
      le9uo_enable:
        description: '是否安装 LE9UO 与 Kcompressd 补丁'
        required: true
        type: boolean
        default: 'true'
      droidspaces_enable:
        description: '是否开启 Droidspaces 容器支持(轻量化的完整Linux容器支持)'
        required: true
        type: choice
        default: 'extend'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      rekernel_enable:
        description: '是否开启 Re-Kernel 支持(与Freezer/NoActive等LSP模块配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'true'
      baseband_guard:
        description: '是否开启 BBG (内核级分区保护，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      better_net:
        description: '是否开启网络功能拓展配置(用于为 ipset 及需要 iptables 等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'true'
      bbr_enable:
        description: '是否安装 BBR 拥塞控制补丁'
        required: true
        type: boolean
        default: 'true'
      intfp_enable:
        description: '是否安装 INTFP '
        required: true
        type: boolean
        default: 'true'
      isqrt_enable:
        description: '是否安装 ISQRT 整数平方根快速库'
        required: true
        type: boolean
        default: 'true'
      intsqrt_enable:
        description: '是否安装 Oryon 优化 int_sqrt 补丁'
        required: true
        type: boolean
        default: 'true'
      adios_enable:
        description: '是否安装 ADIOS IO 调度器'
        required: true
        type: boolean
        default: 'true'
      bore_enable:
        description: '是否安装 BORE 调度器'
        required: true
        type: boolean
        default: 'true'
      cambyses_enable:
        description: '是否安装 Cambyses 调度器'
        required: true
        type: boolean
        default: 'true'
      hmbird_enable:
        description: '是否安装 HMBIRD 调度器'
        required: true
        type: boolean
        default: 'true'
      perf_patch_enable:
        description: '是否安装性能优化补丁集'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存)'
        required: true
        type: boolean
        default: 'true'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-clang19工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev &
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）
          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev libdw-dev zip unzip ccache
          
          #使用最新版ccache v4.12.2（Ubuntu软件仓库的版本并非最新）
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/android16-6.12-2026-03.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_gki_kernel_common-android16-6.12-2026-03" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang19工具链..." &&
          mkdir -p clang19 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip &&
          unzip -q clang.zip -d clang19 &&
          rm -rf clang.zip &
          
          echo "正在克隆Rust 1.82.0工具链..." &&
          mkdir -p rust &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip &&
          unzip -q rust.zip -d rust &&
          rm -rf rust.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-clang19工具链初始化完成！"
          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加 KernelSU
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "BakaSU" ]]; then
            echo "正在配置BakaSU（由于SukiSU长期未维护无法正常编译，且BakaSU兼容sukisu管理器，故SukiSU源码仓库已重定向为BakaSU）..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            #为KernelSU Next添加WildKSU管理器支持
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main 2>/dev/null || git rev-list --count HEAD 2>/dev/null || echo 1145) + 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            # 修正头文件路径（KSU 新布局）
            cd kernel
            for h in include/*.h; do ln -sfn "include/$(basename "$h")" "$(basename "$h")"; done
            [ -d uapi ] && [ ! -L uapi ] && mv uapi uapi.bak
            ln -sfn ../uapi uapi
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" ./Kbuild
          elif [[ ${{ github.event.inputs.ksu_type }} == "KowSU" ]]; then
            echo "正在配置 KowSU..."
            curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count master 2>/dev/null || git rev-list --count main 2>/dev/null || echo 1145) + 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            # 修正头文件路径（KowSU 新布局）
            cd kernel
            for h in include/*.h; do ln -sfn "include/$(basename "$h")" "$(basename "$h")"; done
            [ -d uapi ] && [ ! -L uapi ] && mv uapi uapi.bak
            ln -sfn ../uapi uapi
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi
          
      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch || true
          fi
          
      - name: 应用 LZ4 和 ZSTD 补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加 LZ4 & ZSTD 补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/zram_patch/001-lz4.patch
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/zram_patch/002-zstd.patch
          patch -p1 --no-backup-if-mismatch -F 0 < 001-lz4.patch
          patch -p1 --no-backup-if-mismatch -F 0 < 002-zstd.patch
          
      - name: 应用 LZ4KD 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/zram_patch/lz4kd.patch
          patch -p1 -F 3 < lz4kd.patch || true

      - name: 应用 LZ4KDS 补丁
        if: inputs.lz4kds_enable
        run: |
          echo "正在应用 LZ4KDS 补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/zram_patch/lz4kds.patch
          patch -p1 -F 0 --no-backup-if-mismatch < lz4kds.patch
          # Crystal Hybridswap (lz4kds) 替代原生 zram，CONFIG_ZRAM 必须关闭(其 Kconfig 已声明 depends on ZRAM=n)
          echo "CONFIG_ZRAM=n" >> ./arch/arm64/configs/gki_defconfig
          # 框架入口
          echo "CONFIG_CRYSTALFROSTWORK=y" >> ./arch/arm64/configs/gki_defconfig
          # Crystal Hybridswap 核心
          echo "CONFIG_CRYSTAL_HYBRIDSWAP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_WRITEBACK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_TRACK_ENTRY_ACTIME=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_MEMORY_TRACKING=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_MULTI_COMP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ERM_AVAIL_BUFFER_DEFAULT_ON=y" >> ./arch/arm64/configs/gki_defconfig
          # SDDC + 私有 LZ4KD codec（4KiB 页，ARM64）
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_SDDC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_SDDC_LZ4KD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_SDDC_ZMS_NATIVE=y" >> ./arch/arm64/configs/gki_defconfig
          # 默认压缩算法: lz4kds (私有 delta-capable backend)
          echo 'CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_DEF_COMP="lz4kds"' >> ./arch/arm64/configs/gki_defconfig
          # 锁定 primary compressor 防止 vendor userspace 覆盖
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_LOCK_DEF_COMP=y" >> ./arch/arm64/configs/gki_defconfig
          # 兼容占位 API（可选，vendor userspace 不需要时保持关闭）
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_LEGACY_EMPTY_APIS=n" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_LEGACY_SWAPD_MEMCGS_PARAM=n" >> ./arch/arm64/configs/gki_defconfig
          # KUnit 测试保持关闭（生产内核）
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_SDDC_KUNIT_TEST=n" >> ./arch/arm64/configs/gki_defconfig
          # 固定 zram 大小为物理内存的 109%（14.7GB RAM → 16GB zram）
          # 拦截 disksize 写操作并替换为此比例，用户态写入的值被忽略
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_PIN_SIZE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CRYSTAL_HYBRIDSWAP_ZRAM_PIN_SIZE_PCT=109" >> ./arch/arm64/configs/gki_defconfig
          # 注入 drivers/Kconfig 和 drivers/Makefile 钩子（幂等）
          grep -qF 'drivers/crystalfrostwork/Kconfig' drivers/Kconfig \
            || echo -e '\nsource "drivers/crystalfrostwork/Kconfig"' >> drivers/Kconfig
          grep -qF 'drivers/crystalfrostwork/Kconfig' drivers/Kconfig \
            || { echo "错误: drivers/Kconfig 钩子注入失败"; exit 1; }
          grep -qF 'CONFIG_CRYSTALFROSTWORK' drivers/Makefile \
            || printf '\nobj-$(CONFIG_CRYSTALFROSTWORK)\t+= crystalfrostwork/\n' >> drivers/Makefile
          grep -qF 'CONFIG_CRYSTALFROSTWORK' drivers/Makefile \
            || { echo "错误: drivers/Makefile 钩子注入失败"; exit 1; }
          echo "LZ4KDS 补丁应用完成"

      - name: 应用 LZ4 NEON 加速挂钩
        if: inputs.lz4_enable
        run: |
          echo "正在应用 LZ4 NEON 加速挂钩(将 zram/f2fs/incfs 的 LZ4 解压路由到 ARM64 NEON 汇编实现)…"
          cd kernel_workspace/common
          # 下载挂钩脚本(已随仓库 other_patch/ 分发, 与补丁同分支同版本)
          wget -O apply_lz4_neon.sh https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apply_lz4_neon.sh
          bash apply_lz4_neon.sh
          echo "LZ4 NEON 加速挂钩完成"

      - name: 应用 LE9UO 与 Kcompressd 补丁
        if: inputs.le9uo_enable
        run: |
          echo "正在应用LE9UO 与 Kcompressd 补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/le9uo-1.15.patch
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/kcompressd-0.5.patch
          patch -p1 -F 3 < le9uo-1.15.patch
          patch -p1 -F 3 < kcompressd-0.5.patch
          #LE9UO编入内核后默认启用
          #匿名页硬下限。低于该比例时，le9uo 保护匿名页，范围0-100，为了适配16GB RAM设备，默认为1
          echo "CONFIG_ANON_MIN_RATIO=1" >> ./arch/arm64/configs/gki_defconfig
          #干净文件页硬下限。提高它会保留更多文件缓存，也可能让系统更早触发 OOM，范围0-100，默认为4
          echo "CONFIG_CLEAN_MIN_RATIO=4" >> ./arch/arm64/configs/gki_defconfig
          #干净文件页软阈值。低于该比例时优先回收可换出的匿名页，回收压力最高时可放宽。通常应设为大于或等于 CLEAN_MIN_RATIO，范围0-100，默认为15
          echo "CONFIG_CLEAN_LOW_RATIO=15" >> ./arch/arm64/configs/gki_defconfig
          #Kcompressd-Unofficial编入内核后默认启用
          #在设备上可以通过sysctl -w vm.kcompressd=24 指令修改队列深度，范围0-256，默认为24
          echo "LE9UO 与 Kcompressd补丁应用完成"
          
      - name: 应用 PMICWD 修复补丁
        run: |
          echo "正在应用PMICWD修复补丁(移除 ktime_get() 内 WARN_ON(timekeeping_suspended), 消除 suspend 期 PMICWD 刷屏 WARN)…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/pmicwd_fix.patch
          patch -p1 -F 3 < pmicwd_fix.patch || true
          echo "PMICWD 修复补丁应用完成"

      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
          
      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
            #以下配置选项用于编译zram模块，开启与否不影响内核编译
            echo "CONFIG_ZRAM_BACKEND_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 开启唤醒锁优化配置
          echo "CONFIG_PM_WAKELOCKS_GC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_PM_WAKELOCKS_LIMIT=10" >> ./common/arch/arm64/configs/gki_defconfig
          # 禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          #跳过将uapi标准头安装到 usr/include 目录，加快编译速度
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          # 6.12内核Rust配置
          echo "CONFIG_RUST=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> ./common/arch/arm64/configs/gki_defconfig
          # 开启 arm64 OPTPROBE（kprobe 跳转优化）
          echo "CONFIG_OPTPROBES=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 移植 arm64 OPTPROBE v7（HiSilicon，LKML 2503.3/02174）+ 修复版: bti j + 回调op传参(ldr x0,[x0]) + 指令安全检查(拒绝PC相对/PAC/分支/异常指令重放)，适配 6.12.69
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/optprobe_6.12.69.patch
          patch -p1 -F 3 < optprobe_6.12.69.patch

      - name: 集成 BBR 拥塞控制补丁
        if: inputs.bbr_enable
